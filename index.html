<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌈関根ごきげんおみくじ🌈</title>



<style>

body{

font-family:sans-serif;

background:#f7f7f7;

text-align:center;

padding:30px;

}



h1{

color:#ff69b4;

}



button{

font-size:28px;

padding:20px 40px;

border:none;

border-radius:15px;

background:#ff69b4;

color:white;

cursor:pointer;

}



#result{

margin-top:30px;

font-size:28px;

background:white;

padding:25px;

border-radius:20px;

box-shadow:0 0 10px rgba(0,0,0,0.1);

max-width:700px;

margin-left:auto;

margin-right:auto;

}

</style>

</head>



<body>



<h1>🌈ごきげんおみくじ🌈</h1>



<button onclick="omikuji()">おみくじを引く</button>



<div id="result">

ボタンを押してね✨

</div>



<script>



const fortunes = [



"超大吉：今日は探し物が探す前に見つかる日。エスパー並に。",



"大吉：今日は買い物の会計が777の日。",



"大吉：今日はお祭り気分で一日過ごせる日。",



"大吉：今日はお菓子の当たり部分を引く日。",



"大吉：今日は夕飯カレーの日。",



"大吉：今日は信号がちょっと味方してくれる日。",



"中吉：今日は思ったより悪くない日。",



"中吉：今日は『まあいっか』で全部なんとかなる日。",



"中吉：今日は誰かがちょっと優しい日。",



"中吉：今日は信号が一度も赤で止まらない日。",



"小吉：今日はぼちぼちだと思ったら一発逆転の日。",



"小吉：今日は袋の開け口がすぐ見つかる日。老眼でも一発！",



"小吉：今日は髪型が夕方までビシッと決まる日。",



"小吉：今日はペンをなくさない日。",



"末吉：今日は冷蔵庫を開けても目的を忘れない日。",



"末吉：今日は『あれ？意外とうまくいった』が起きる日。",



"末吉：今日は小さなラッキーが渋滞している日。",



"末吉：今日はなんとなく全部ちょうどいい日。"



];



function omikuji() {



const random =

fortunes[Math.floor(Math.random()*fortunes.length)];



document.getElementById("result").innerHTML =

random + "<br><br>✨良い一日になりますように✨";



}



</script>



</body>

</html>
